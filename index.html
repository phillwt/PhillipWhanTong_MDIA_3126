<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1: Button Component</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="code.js"></script>
</head>

<body>
    <h2>Button 1: Primary</h2>
    <button class="main-button button-primary" id="button1">Button 1</button>

    <h2>Button 2: Secondary</h2>
    <button class="main-button button-secondary" id="button2">Button 2</button>

    <h2>Button 3: Disabled (and Primary)</h2>
    <button class="main-button button-primary button-disabled" id="button3">Button 3</button>

    <h2>Button 4: Big</h2>
    <button class="main-button button-secondary button-big" id="button4">Button 4</button>
</body>

</html>
